# Weekly digest pipeline — runs Sunday evening, before Monday's reviews.
# Fetches RSS feeds, analyzes with Gemini, saves knowledge files, commits.
#
# Knowledge files feed into Mon-Sat review system via digest-intelligence.md.

name: Weekly Digests

on:
  schedule:
    - cron: '0 22 * * 0'  # Sunday 6pm ET (10pm UTC)
  workflow_dispatch:
    inputs:
      context:
        description: 'Which digest to run (or all)'
        required: true
        type: choice
        options:
          - all
          - crumbl-ops
          - command-center
          - wealth-mgmt

jobs:
  digest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r digest/requirements.txt

      - name: Install gh CLI (for cross-repo issue creation)
        run: |
          if ! command -v gh >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y gh
          fi
          gh --version

      - name: Determine contexts to run
        id: contexts
        run: |
          INPUT="${{ inputs.context || 'all' }}"
          if [ "$INPUT" = "all" ]; then
            echo "contexts=crumbl-ops command-center wealth-mgmt" >> $GITHUB_OUTPUT
          else
            echo "contexts=$INPUT" >> $GITHUB_OUTPUT
          fi

      - name: Validate secrets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DIGEST_GH_TOKEN: ${{ secrets.DIGEST_GH_TOKEN }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::GEMINI_API_KEY secret is not set."
            exit 1
          fi
          if [ -z "$DIGEST_GH_TOKEN" ]; then
            echo "::warning::DIGEST_GH_TOKEN not set — issues will not be created. Set a fine-grained PAT with Issues:write on crumbl-ops, command-center, wealth-mgmt."
          fi
          echo "Secrets validated"

      - name: Run digests
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SMTP_USER: "michael@bluegrasscookies.com"
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          GH_TOKEN: ${{ secrets.DIGEST_GH_TOKEN }}
        run: |
          FAILED=0
          for CTX in ${{ steps.contexts.outputs.contexts }}; do
            echo "=== Running $CTX digest ==="
            if ! python -m digest \
              --context "digest/config/context-${CTX}.yaml" \
              --days 7; then
              echo "::warning::$CTX digest failed"
              FAILED=$((FAILED + 1))
            fi
            echo ""
          done

          if [ "$FAILED" -gt 0 ]; then
            echo "::warning::$FAILED digest(s) failed"
          fi

      - name: Commit knowledge files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/digest_knowledge/
          if git diff --cached --quiet; then
            echo "No new digest knowledge to commit"
          else
            COUNT=$(git diff --cached --name-only | wc -l)
            git commit -m "Weekly digest: ${COUNT} knowledge files updated [automated]"
            git push
            echo "Committed $COUNT files"
          fi
