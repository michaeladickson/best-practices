# Weekly digest pipeline — manual dispatch only.
#
# Primary execution is local via scripts/run_weekly_digest.sh registered with
# Windows Task Scheduler. Local execution uses local gh auth + GCP Secret
# Manager — no PAT stored in this public repo.
#
# This workflow stays available for manual re-runs. It does not create issues
# (DIGEST_GH_TOKEN is intentionally not provided), it only sends emails and
# commits knowledge files.

name: Weekly Digests

on:
  workflow_dispatch:
    inputs:
      context:
        description: 'Which digest to run (or all)'
        required: true
        type: choice
        options:
          - all
          - crumbl-ops
          - command-center
          - wealth-mgmt

jobs:
  digest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r digest/requirements.txt

      - name: Install gh CLI (for cross-repo issue creation)
        run: |
          if ! command -v gh >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y gh
          fi
          gh --version

      - name: Determine contexts to run
        id: contexts
        run: |
          INPUT="${{ inputs.context || 'all' }}"
          if [ "$INPUT" = "all" ]; then
            echo "contexts=crumbl-ops command-center wealth-mgmt" >> $GITHUB_OUTPUT
          else
            echo "contexts=$INPUT" >> $GITHUB_OUTPUT
          fi

      - name: Validate secrets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::GEMINI_API_KEY secret is not set."
            exit 1
          fi
          echo "Secrets validated (note: workflow does not create GH issues — use local Task Scheduler for that)"

      - name: Run digests
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SMTP_USER: "michael@bluegrasscookies.com"
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: |
          FAILED=0
          for CTX in ${{ steps.contexts.outputs.contexts }}; do
            echo "=== Running $CTX digest ==="
            if ! python -m digest \
              --context "digest/config/context-${CTX}.yaml" \
              --days 7; then
              echo "::warning::$CTX digest failed"
              FAILED=$((FAILED + 1))
            fi
            echo ""
          done

          if [ "$FAILED" -gt 0 ]; then
            echo "::warning::$FAILED digest(s) failed"
          fi

      - name: Commit knowledge files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/digest_knowledge/
          if git diff --cached --quiet; then
            echo "No new digest knowledge to commit"
          else
            COUNT=$(git diff --cached --name-only | wc -l)
            git commit -m "Weekly digest: ${COUNT} knowledge files updated [automated]"
            git push
            echo "Committed $COUNT files"
          fi
