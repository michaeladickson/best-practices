# Run the offline test suite on every PR and push to main.
#
# Why: tests/test_model_strings_pinned.py (#28) is a gate, and a gate that only
# runs when someone remembers to run pytest locally is not one. The suite is
# offline by construction (tests/conftest.py refuses network), so it needs no
# secrets.

name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r digest/requirements.txt pytest
      - name: Run tests
        run: python -m pytest -q
