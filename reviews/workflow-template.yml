# Claude-only, diff-scoped review workflow (rebuilt 2026-07-26).
# Review prompts fetched from best-practices repo at runtime.
#
# Why this shape (evidence from the 2026-07-26 review-system audit):
#   - The former dual-model (Gemini + Claude + synthesis) design never paid:
#     Gemini's full-repo snapshot calls were truncated/timing out ("data caps"),
#     ~100% of its findings were dismissed in synthesis, a curl timeout could
#     kill the job before Claude ran, and it forced a GCP credential into every
#     repo (an 11-day auth outage broke 10 straight runs). Claude reviews the
#     repo agentically and needs none of that.
#   - Weekly reviews are DIFF-SCOPED: they review the window's changes in
#     context instead of re-reading the whole repo weekly, which had produced
#     0-net-new-finding issues against a backlog nobody read. Quiet week -> no
#     issue filed at all.
#   - Full-scope judgment lives in the monthly reviews (cto, context-memory,
#     model-hierarchy) driven by the best-practices yardstick prompts.
#   - Every cron uses a UNIQUE fire-time: GitHub coalesces same-minute crons,
#     which silently ate the monthly reviews in the old layout.
#
# Setup:
# 1. Copy this to .github/workflows/weekly-reviews.yml in your repo
# 2. Create .github/prompts/review-context.md from the template in best-practices/reviews/
# 3. Set secret: CLAUDE_CODE_OAUTH_TOKEN (that's all — no GCP anything)
# 4. Ensure GITHUB_TOKEN has issues:write permission

name: Weekly Reviews

on:
  schedule:
    - cron: '23 13 * * 1'   # Monday ~9:23am ET — changes review (code + security, week diff)
    - cron: '23 13 * * 4'   # Thursday ~9:23am ET — data + QA review (week diff)
    - cron: '51 13 22 * *'  # 22nd monthly — CTO strategic review
    - cron: '37 13 1 * *'   # 1st monthly — context & memory self-assessment
    - cron: '37 13 15 * *'  # 15th monthly — model-hierarchy / delegation self-assessment
  workflow_dispatch:
    inputs:
      review_type:
        description: 'Review type to run'
        required: true
        type: choice
        options:
          - changes
          - data-qa
          - cto
          - context-memory
          - model-hierarchy

permissions:
  contents: read
  issues: write
  id-token: write  # claude-code-action OAuth exchange requires OIDC

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine review type
        id: review-type
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "type=${{ inputs.review_type }}" >> $GITHUB_OUTPUT
          else
            case "${{ github.event.schedule }}" in
              '23 13 * * 1')  echo "type=changes"         >> $GITHUB_OUTPUT ;;
              '23 13 * * 4')  echo "type=data-qa"         >> $GITHUB_OUTPUT ;;
              '51 13 22 * *') echo "type=cto"             >> $GITHUB_OUTPUT ;;
              '37 13 1 * *')  echo "type=context-memory"  >> $GITHUB_OUTPUT ;;
              '37 13 15 * *') echo "type=model-hierarchy" >> $GITHUB_OUTPUT ;;
              *)              echo "type=changes"         >> $GITHUB_OUTPUT ;;
            esac
          fi

      - name: Fetch review prompts
        run: |
          TYPE="${{ steps.review-type.outputs.type }}"
          BASE="https://raw.githubusercontent.com/michaeladickson/best-practices/main/reviews"
          case "$TYPE" in
            changes)
              curl -sf "${BASE}/code-review.md" -o review-prompt.md
              printf '\n\n---\n\n' >> review-prompt.md
              curl -sf "${BASE}/security-review.md" >> review-prompt.md
              ;;
            data-qa)
              curl -sf "${BASE}/data-review.md" -o review-prompt.md
              printf '\n\n---\n\n' >> review-prompt.md
              curl -sf "${BASE}/qa-review.md" >> review-prompt.md
              ;;
            *)
              curl -sf "${BASE}/${TYPE}-review.md" -o review-prompt.md
              ;;
          esac

      - name: Fetch open issues for dedup
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "# Existing Open Issues"
            echo ""
            echo "These issues are already tracked. Do NOT re-report findings that are"
            echo "covered by an existing issue."
            echo ""
            gh issue list --state open --limit 100 --json number,title,body \
              --jq '.[] | "## #\(.number): \(.title)\n\(.body)\n"'
          } > existing-issues.md

      - name: Build week diff
        id: diff
        if: steps.review-type.outputs.type == 'changes' || steps.review-type.outputs.type == 'data-qa'
        run: |
          BASE_REF=$(git rev-list -1 --before="8 days ago" HEAD || true)
          if [ -z "$BASE_REF" ]; then
            # Repo younger than the window — diff from the root commit
            BASE_REF=$(git rev-list --max-parents=0 HEAD | tail -1)
          fi
          COMMITS=$(git log --oneline "${BASE_REF}..HEAD" | wc -l)
          echo "commits=$COMMITS" >> $GITHUB_OUTPUT
          if [ "$COMMITS" -eq 0 ]; then
            echo "No commits in the review window — skipping review, no issue will be filed."
            exit 0
          fi
          {
            echo "# Changes under review (${COMMITS} commits since ${BASE_REF})"
            echo ""
            echo "## Commits"
            git log --oneline "${BASE_REF}..HEAD"
            echo ""
            echo "## Stat"
            git diff --stat "${BASE_REF}..HEAD"
            echo ""
            echo "## Diff"
          } > week-diff.md
          # Cap the inline diff; the agent can read full files itself.
          git diff "${BASE_REF}..HEAD" > full.diff
          if [ "$(wc -c < full.diff)" -gt 300000 ]; then
            echo "_Diff exceeds 300KB — file list above is authoritative; read changed files directly._" >> week-diff.md
            head -c 300000 full.diff >> week-diff.md
          else
            cat full.diff >> week-diff.md
          fi

      - name: Run review
        if: steps.diff.outputs.commits != '0'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --model claude-fable-5
            --effort max
            --allowedTools Read,Glob,Grep,Bash,Write
            --mcp-config '{"mcpServers":{}}'
          settings: '{"env": {"GH_TOKEN": "${{ github.token }}"}}'
          prompt: |
            TYPE="${{ steps.review-type.outputs.type }}" review.

            FIRST: If .github/prompts/review-context.md exists, read it — threat
            model and intentional design decisions you must NOT flag.
            ALSO: Read existing-issues.md — do NOT re-report anything tracked there.
            THEN: Read review-prompt.md for review instructions and focus areas.

            SCOPE:
            - If week-diff.md exists, this is a CHANGE review: review the
              window's changes in their surrounding context (read neighboring
              code as needed). Do NOT audit unchanged code; do NOT restate
              old findings about files the diff doesn't touch. Where a prompt
              says "review all source files", the diff scope overrides it.
            - If week-diff.md does not exist, this is a monthly full-scope
              review — follow review-prompt.md as written. Machine-local
              surfaces (cross-session memory, Task Scheduler, usage.db) are
              not inspectable from CI; grade repo-visible evidence and mark
              those "not inspectable from CI" rather than Missing.

            OUTPUT:
            - If there are no findings worth a human's time, print
              "No findings this window." and DO NOT create an issue.
            - Otherwise write findings to review-output.md (specific: file,
              line, why it matters, concrete fix; markdown checkboxes) and
              create ONE GitHub issue via gh:
              - changes         -> title "Weekly Changes Review — YYYY-MM-DD", labels "code-review,automated"
              - data-qa         -> title "Weekly Data+QA Review — YYYY-MM-DD", labels "qa-review,automated"
              - cto             -> title "Monthly CTO Review — YYYY-MM-DD", labels "cto-review,automated"
              - context-memory  -> title "Context & Memory Review — YYYY-MM-DD", labels "context-memory-review,automated"
              - model-hierarchy -> title "Model Hierarchy Review — YYYY-MM-DD", labels "model-hierarchy-review,automated"
              (fall back to no labels if a label doesn't exist)
