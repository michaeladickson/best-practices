# Dual-model review workflow (Gemini + Claude → Synthesis).
# Review prompts fetched from best-practices repo at runtime.
#
# Setup:
# 1. Copy this to .github/workflows/weekly-reviews.yml in your repo
# 2. Create .github/prompts/review-context.md from the template in best-practices/reviews/
# 3. Set secrets: ANTHROPIC_API_KEY (or CLAUDE_CODE_OAUTH_TOKEN), GCP_SA_KEY
# 4. Ensure GITHUB_TOKEN has issues:write permission

name: Weekly Reviews

on:
  schedule:
    - cron: '53 12 * * 1'  # Monday ~8am ET (code review)
    - cron: '53 12 * * 2'  # Tuesday ~8am ET (security review)
    - cron: '53 12 * * 3'  # Wednesday ~8am ET (UI review)
    - cron: '53 12 * * 4'  # Thursday ~8am ET (data review)
    - cron: '53 12 * * 5'  # Friday ~8am ET (QA review)
    - cron: '53 16 * * 5'  # Friday ~12pm ET (DevOps review)
    - cron: '53 14 * * 6'  # Saturday ~10am ET (CTO review — after all functions complete)
    - cron: '53 12 1 * *'  # 1st of month ~8am ET (context & memory self-assessment)
    - cron: '53 12 15 * *'  # 15th of month ~8am ET (model-hierarchy / delegation self-assessment)
  workflow_dispatch:
    inputs:
      review_type:
        description: 'Review type to run'
        required: true
        type: choice
        options:
          - code
          - security
          - ui
          - data
          - qa
          - devops
          - cto
          - context-memory
          - model-hierarchy

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Determine review type
        id: review-type
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "type=${{ inputs.review_type }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "53 12 1 * *" ]; then
            # Monthly crons fire alongside whatever weekly review shares the day;
            # github.event.schedule tells us which cron this run belongs to.
            echo "type=context-memory" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "53 12 15 * *" ]; then
            echo "type=model-hierarchy" >> $GITHUB_OUTPUT
          else
            DOW=$(date -u +%u)
            case $DOW in
              1) echo "type=code" >> $GITHUB_OUTPUT ;;
              2) echo "type=security" >> $GITHUB_OUTPUT ;;
              3) echo "type=ui" >> $GITHUB_OUTPUT ;;
              4) echo "type=data" >> $GITHUB_OUTPUT ;;
              5)
                HOUR=$(date -u +%H)
                if [ "$HOUR" -ge 15 ]; then
                  echo "type=devops" >> $GITHUB_OUTPUT
                else
                  echo "type=qa" >> $GITHUB_OUTPUT
                fi ;;
              6) echo "type=cto" >> $GITHUB_OUTPUT ;;
              *) echo "type=code" >> $GITHUB_OUTPUT ;;
            esac
          fi

      # ── Fetch centralized prompts from best-practices repo ──────────
      - name: Fetch review prompts
        run: |
          TYPE="${{ steps.review-type.outputs.type }}"
          BASE="https://raw.githubusercontent.com/michaeladickson/best-practices/main/reviews"
          curl -sf "${BASE}/${TYPE}-review.md" -o review-prompt.md
          if [ "$TYPE" != "cto" ] && [ "$TYPE" != "context-memory" ] && [ "$TYPE" != "model-hierarchy" ]; then
            curl -sf "${BASE}/synthesize.md" -o synthesize-prompt.md
          fi

      # ── Fetch existing open issues for dedup ────────────────────────
      - name: Fetch open issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "# Existing Open Issues"
            echo ""
            echo "These issues are already tracked. Do NOT re-report findings that are"
            echo "covered by an existing issue. If a finding is already listed below,"
            echo "skip it entirely — even if you would phrase it differently."
            echo ""
            gh issue list --state open --limit 100 --json number,title,body \
              --jq '.[] | "## #\(.number): \(.title)\n\(.body)\n"'
          } > existing-issues.md

          ISSUE_COUNT=$(gh issue list --state open --limit 100 --json number --jq 'length')
          echo "Fetched $ISSUE_COUNT open issues for dedup"

      # ── CTO Review (runs instead of Gemini+Claude+Synthesis) ────────
      - name: Run CTO review
        if: steps.review-type.outputs.type == 'cto'
        uses: anthropics/claude-code-action@beta
        with:
          mode: agent
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_tools: Read,Glob,Grep,Bash,Write
          mcp_config: '{"mcpServers":{}}'
          direct_prompt: |
            You are running a CTO-level strategic review. Read review-prompt.md for full instructions.

            FIRST: Use the gh CLI to fetch this week's review issues:
              gh issue list --state all --limit 10 --label "automated" --json number,title,body,createdAt \
                --jq '.[] | select(.createdAt > (now - 7*24*3600 | strftime("%Y-%m-%dT%H:%M:%SZ")))' \
                > /dev/null 2>&1 || true

            Actually, use this approach to get the last 7 days of review issues:
              gh issue list --state all --limit 20 --label "automated" --json number,title,body,createdAt

            Read each issue body. These are the Code, Security, UI, and QA reviews from this week.
            Also read existing-issues.md for the full list of open issues.

            If .github/prompts/review-context.md exists, read it for project context.

            Perform the CTO review as specified in review-prompt.md.

            Write output to review-output.md, then create a GitHub issue:
            - Title: "Weekly CTO Review — YYYY-MM-DD" (today's date)
            - Labels: "cto-review,automated"
            - Body: contents of review-output.md
          claude_env: |
            GH_TOKEN=${{ github.token }}

      - name: Skip remaining steps for CTO review
        if: steps.review-type.outputs.type == 'cto'
        run: echo "CTO review complete — skipping function-level review steps"

      # ── Context & Memory self-assessment (monthly, Claude-only) ─────
      - name: Run context-memory review
        if: steps.review-type.outputs.type == 'context-memory'
        uses: anthropics/claude-code-action@beta
        with:
          mode: agent
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_tools: Read,Glob,Grep,Bash,Write
          mcp_config: '{"mcpServers":{}}'
          direct_prompt: |
            You are running the monthly context & memory management self-assessment.
            Read review-prompt.md for the full instructions and grading areas.

            FIRST: If .github/prompts/review-context.md exists, read it for project
            context and intentional design decisions — do NOT flag those.

            ALSO: Read existing-issues.md — do NOT report findings already tracked there.

            NOTE: You are running in CI, so the cross-session memory directory
            (~/.claude/projects/...) is not inspectable here. Grade what is visible
            in the repo (CLAUDE.md files, knowledge/, decisions/, skills, rules,
            workflows, scheduled-agent code) and mark machine-local areas as
            "not inspectable from CI" rather than Missing.

            Write your complete findings to review-output.md, then create a GitHub
            issue using the gh CLI:
            - Title: "Context & Memory Review — YYYY-MM-DD" (today's date)
            - Labels: "context-memory-review,automated" (fall back to no labels if
              the label doesn't exist)
            - Body: contents of review-output.md
          claude_env: |
            GH_TOKEN=${{ github.token }}

      # ── Model-hierarchy / delegation self-assessment (monthly, Claude-only) ─
      - name: Run model-hierarchy review
        if: steps.review-type.outputs.type == 'model-hierarchy'
        uses: anthropics/claude-code-action@beta
        with:
          mode: agent
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_tools: Read,Glob,Grep,Bash,Write
          mcp_config: '{"mcpServers":{}}'
          direct_prompt: |
            You are running the monthly model-hierarchy / delegation self-assessment.
            Read review-prompt.md for the full instructions and grading areas.

            FIRST: If .github/prompts/review-context.md exists, read it for project
            context and intentional design decisions — do NOT flag those.

            ALSO: Read existing-issues.md — do NOT report findings already tracked there.

            NOTE: You are running in CI, so machine-local surfaces (usage.db, Task
            Scheduler, cross-session memory) are not inspectable here. Grade what is
            visible in the repo — CLAUDE.md routing/subagent guidance, .claude/agents/
            definitions, skills that should delegate, scheduled-agent code and its
            model choices — and mark machine-local areas as "not inspectable from CI"
            rather than Missing.

            Write your complete findings to review-output.md, then create a GitHub
            issue using the gh CLI:
            - Title: "Model Hierarchy Review — YYYY-MM-DD" (today's date)
            - Labels: "model-hierarchy-review,automated" (fall back to no labels if
              the label doesn't exist)
            - Body: contents of review-output.md
          claude_env: |
            GH_TOKEN=${{ github.token }}

      # ── Step 1: Gemini review (skipped for CTO) ───────────────────
      - name: Collect source files for Gemini
        if: steps.review-type.outputs.type != 'cto' && steps.review-type.outputs.type != 'context-memory' && steps.review-type.outputs.type != 'model-hierarchy'
        run: |
          {
            # Include project-specific review context if it exists
            if [ -f .github/prompts/review-context.md ]; then
              cat .github/prompts/review-context.md
              echo ""
            fi

            echo "# Source files for review"
            echo ""

            # Python files
            for f in $(find . -name '*.py' -not -path '*/venv/*' -not -path '*__pycache__*' -not -path '*node_modules*' -not -path '*/.venv/*' | sort); do
              echo "## $f"
              echo '```python'
              cat "$f"
              echo '```'
              echo ""
            done

            # TypeScript/JavaScript files
            for f in $(find . -name '*.tsx' -o -name '*.ts' | grep -v node_modules | grep -v '.d.ts' | sort); do
              echo "## $f"
              echo '```typescript'
              cat "$f"
              echo '```'
              echo ""
            done

            # Swift files
            for f in $(find . -name '*.swift' -not -path '*/Pods/*' -not -path '*/.build/*' | sort); do
              echo "## $f"
              echo '```swift'
              cat "$f"
              echo '```'
              echo ""
            done
          } > source-snapshot.md

      - name: Authenticate to GCP
        if: steps.review-type.outputs.type != 'cto' && steps.review-type.outputs.type != 'context-memory' && steps.review-type.outputs.type != 'model-hierarchy'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Run Gemini review
        if: steps.review-type.outputs.type != 'cto' && steps.review-type.outputs.type != 'context-memory' && steps.review-type.outputs.type != 'model-hierarchy'
        run: |
          TYPE="${{ steps.review-type.outputs.type }}"
          PROJECT="${{ vars.GCP_PROJECT_ID || 'hybrid-elysium-471814-p2' }}"
          LOCATION="us-central1"
          MODEL="gemini-2.5-flash"

          # Build the full prompt
          {
            if [ -f .github/prompts/review-context.md ]; then
              cat .github/prompts/review-context.md
              echo ""
            fi
            cat existing-issues.md
            echo ""
            cat review-prompt.md
            echo ""
            echo "Here are the source files to review:"
            echo ""
            cat source-snapshot.md
          } > gemini-full-prompt.txt

          # Build JSON request using Python (avoids shell arg length limits)
          python3 -c "
          import json
          with open('gemini-full-prompt.txt') as f:
              text = f.read()
          req = {
              'contents': [{'role': 'user', 'parts': [{'text': text}]}],
              'generationConfig': {'temperature': 0.2, 'maxOutputTokens': 8192}
          }
          json.dump(req, open('gemini-request.json', 'w'))
          print(f'Request size: {len(text)//1024}KB')
          "

          ACCESS_TOKEN=$(gcloud auth print-access-token)
          ENDPOINT="https://${LOCATION}-aiplatform.googleapis.com/v1/projects/${PROJECT}/locations/${LOCATION}/publishers/google/models/${MODEL}:generateContent"

          RESP=$(curl -s -X POST "$ENDPOINT" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d @gemini-request.json \
            --max-time 300)

          echo "$RESP" | jq -r '.candidates[0].content.parts[0].text // empty' > gemini-output.md

          if [ ! -s gemini-output.md ]; then
            echo "$RESP" | jq -r '.error.message // "Unknown error"' >&2
            echo "Gemini review produced no output. Synthesis will use Claude's review only." > gemini-output.md
          fi

          echo "--- Gemini output (first 20 lines) ---"
          head -20 gemini-output.md

      # ── Step 2: Claude review ───────────────────────────────────────
      - name: Prepare Claude prompt
        if: steps.review-type.outputs.type != 'cto' && steps.review-type.outputs.type != 'context-memory' && steps.review-type.outputs.type != 'model-hierarchy'
        run: |
          TYPE="${{ steps.review-type.outputs.type }}"
          echo "$TYPE" > review-type.txt
          # Hide .mcp.json so claude-code-action doesn't try to start MCP servers
          mv .mcp.json .mcp.json.bak 2>/dev/null || true

      - name: Run Claude review
        if: steps.review-type.outputs.type != 'cto' && steps.review-type.outputs.type != 'context-memory' && steps.review-type.outputs.type != 'model-hierarchy'
        uses: anthropics/claude-code-action@beta
        with:
          mode: agent
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_tools: Read,Glob,Grep,Bash,Write
          mcp_config: '{"mcpServers":{}}'
          direct_prompt: |
            FIRST: If .github/prompts/review-context.md exists, read it — it defines what
            this app is, its threat model, intentional design decisions you must NOT flag,
            and what makes a good vs bad finding. Follow it strictly.

            THEN: Read review-prompt.md for the specific review instructions.

            ALSO: Read existing-issues.md — do NOT report findings already tracked there.

            Review all source files in the repository.

            When done, write your complete findings to a file called claude-output.md
            in the repository root. Output ONLY the findings as specified in the prompt
            file, no title or extra text.

      # ── Step 3: Synthesize both reviews (skipped for CTO) ──────────
      - name: Synthesize reviews
        if: steps.review-type.outputs.type != 'cto' && steps.review-type.outputs.type != 'context-memory' && steps.review-type.outputs.type != 'model-hierarchy'
        uses: anthropics/claude-code-action@beta
        with:
          mode: agent
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_tools: Read,Glob,Grep,Bash,Write
          mcp_config: '{"mcpServers":{}}'
          direct_prompt: |
            You have two independent reviews of the same codebase — one from Claude
            (claude-output.md) and one from Gemini (gemini-output.md).

            Read both files, then read synthesize-prompt.md for detailed instructions.

            If .github/prompts/review-context.md exists, read it too — it defines
            intentional design decisions that should NOT be flagged.

            CRITICAL: Also read existing-issues.md. Any finding that duplicates or overlaps
            with an existing open issue MUST be moved to the "Dismissed" section with the
            note "Already tracked in #<number>". Do not create duplicate work items.

            Write the synthesized issue body to review-output.md in the repository root.
            Output ONLY the synthesized issue body, no title or preamble.

            After writing review-output.md, create a GitHub issue using the gh CLI:
            - Read the TYPE from the file 'review-type.txt' (contains: code, security, ui, or qa)
            - Title format: "Weekly {Type} Review — YYYY-MM-DD" (use today's date)
            - Labels: "{type}-review,automated"
            - Body: contents of review-output.md
          claude_env: |
            GH_TOKEN=${{ github.token }}
