# Project context for relevance scoring and recommendations.
# Swap this file to tailor the digest for different projects.

project_name: "crumbl-ops"
description: |
  Operations platform for 3 Crumbl Cookies franchise locations + a holding company in Kentucky.

tech_stack: |
  Python 3.12, FastAPI, PostgreSQL, React 18 + TypeScript, GCP Cloud Run.
  External integrations: QuickBooks Online API, Crumbl GraphQL API, Gmail, SendGrid, When I Work.

current_ai_usage: |
  - Claude Code for all development (with CLAUDE.md, local CLAUDE.md files, knowledge/ system, memory)
  - MCP server for read-only QBO queries
  - Gemini for email classification and digest analysis
  - No customer-facing AI features yet

key_areas: |
  - Automated daily accounting sync (sales → QBO journal entries)
  - Vendor invoice parsing (Sysco, US Foods PDFs → QBO bills)
  - Payroll engine (biweekly, Kentucky OT law)
  - Production planning and demand forecasting
  - Month-end accruals and financial reporting
  - Inventory and receiving workflows (partially built)

interests: |
  - Making Claude Code sessions more efficient
  - Automating more operational workflows
  - Better financial modeling and reporting
  - AI-powered features for the business (not just development tooling)

