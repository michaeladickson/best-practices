# Crumbl-ops digest context — merges engineering + operational-finance interests.
# Targets crumbl-ops repo: a single weekly issue covers both lenses.
#
# ACCURACY MATTERS MORE THAN COVERAGE HERE. The generator reasons about the
# platform from this file alone and cannot see the code, so a wrong line becomes
# a confidently-wrong "10/10 relevance" recommendation. This has already cost two
# full evaluation cycles: crumbl-ops#968 (2026-07-15) and #1252 (2026-08-01) each
# rated ideas top-relevance on "Gemini does vendor invoice extraction", which was
# never true — invoice parsing is deterministic per-vendor code. Every idea in
# both issues was premise-broken or already-built.
#
# Claims below verified against crumbl-ops @ 2026-08-01. Before editing, re-verify
# rather than reasoning from this file's own history:
#   grep -rln "gemini_client\|GenerativeModel" src/ --include=*.py   # real LLM sites
#   grep -rln "gemini\|anthropic" src/invoices/                      # expect NO matches
#   grep -E "^    name:" config/stores.yaml                          # store roster
# Prefer naming the module. "Gemini in src/cs/" is checkable; "AI for email" is not.

project_name: "crumbl-ops"
description: |
  Operations platform for 6 Crumbl Cookies franchise locations across Kentucky
  and Ohio (Lexington, Richmond, Nicholasville, Newport, Florence KY; Western
  Hills OH), under the Bluegrass Cookie Partners holding entity. The two 2026
  acquisitions have CLOSED — this is a 6-store operator, not a 3-store one
  mid-expansion. Also now serves its first external customer (a separate
  franchisee) on an isolated instance with no data comingling.
  Owner/operator acts as both CTO and CFO — engineering AND finance workflows
  live in this repo. Automates daily accounting, inventory, production planning,
  vendor invoices, payroll, reporting, and a dual-model weekly review system.

tech_stack: |
  Python 3.12, FastAPI, PostgreSQL 17, React 18 + TypeScript, GCP Cloud Run.
  External: QuickBooks Online API, Crumbl GraphQL API, Gmail, SendGrid, When I Work.
  AI: Gemini for customer-service and reporting text (NOT for document parsing);
  Claude Code as primary development partner, including headless `claude -p` in
  scheduled jobs.

current_ai_usage: |
  Verified call sites — do not generalise beyond these:
  - Claude Code for all development (CLAUDE.md, knowledge/ system, skills/)
  - Headless `claude -p` in scheduled jobs: month-end CFO/controller narrative,
    weekly memory consolidation, monthly knowledge curation
  - MCP server for read-only QBO queries
  - Gemini in src/cs/: customer-service email classification, donation screening,
    draft response generation
  - Gemini in src/ops/: morning digest synthesis, shift reports, Slack shift
    summary, weekly BI report, SKU shadow matching
  - Dual-model adversarial weekly reviews (Gemini red-team + Claude reviewer)

  Explicitly NOT AI — recommendations assuming otherwise are wrong:
  - Vendor invoice parsing (Sysco, US Foods, Alsco, Crumbl franchising) is
    DETERMINISTIC per-vendor parsers in src/invoices/vendors.py. Zero LLM calls.
    This is the single most repeated false premise; see #968 and #1252.
  - Demand forecasting is the hand-built v3 model in src/ops/forecast*.py. The
    LightGBM/ML models were deleted in 2026-05 (only a stale requirements pin
    remains); "LightGBM baseline" is no longer an accurate description.

  Already-built, so "add this" ideas land as duplicates:
  - LLM eval harness: golden sets in tests/fixtures/llm_eval/ plus an `llm_eval`
    pytest marker, gated by tests/test_model_strings_pinned.py, which forces an
    eval run before any model string can be bumped
  - Prompt-injection hardening: one canonical home in src/ops/secret_redaction.py
    (escape_for_prompt / redact_secrets), enforced by AST tripwire tests
  - Verifiable task completion: the /verify skill + scripts/verify_dq_coverage.py
  - Financial analysis skills: /financials, /month-end, /payroll-import,
    scripts/consolidated_balance_sheet.py, src/ops/month_end_review.py

  Cost model: Claude runs on a Max subscription with NO API key. Recommendations
  about API-key spend caps, token budget caps on `claude -p`, or per-call billing
  controls do not apply and have been explicitly rejected before.

key_areas: |
  Engineering:
  - Automated daily accounting sync (sales → QBO journal entries)
  - Vendor invoice parsing and processing (Sysco, US Foods, franchising)
  - Production planning and demand forecasting
  - Inventory and receiving workflows
  - FastAPI + React frontend, Cloud Run deployment

  Finance / CFO:
  - Payroll engine (biweekly, Kentucky OT law, tip distribution; PEO is BBSI
    since 2026-06-21, previously Gusto)
  - Month-end accruals, reconciliation, variance analysis
  - Multi-entity financial reporting and intercompany-eliminated consolidation
    (Bluegrass Cookie Partners holding + 6 store entities, each its own QBO company)
  - Labor cost tracking and scheduling optimization
  - Marketplace platform reconciliation (DoorDash, UberEats, Grubhub)

interests: |
  Engineering leadership:
  - Making Claude Code sessions more efficient (hooks, skills, memory, session management)
  - AI-driven testing and QA: automated test generation, property-based testing, mutation testing
  - Observability and monitoring: alerting strategies, SLOs, data pipeline health checks
  - Scaling small-team engineering: maintaining quality with 1-2 engineers across multiple repos
  - AI agents for operations: autonomous deployment, self-healing pipelines, anomaly detection
  - Technical debt management: measurement, prioritization, paydown strategies
  - Forecast model evaluation: backtesting frameworks, accuracy tracking, model drift detection

  CFO / operational finance:
  - LLMs for document extraction (invoices, statements, receipts, tax forms)
  - Automated financial reporting and variance analysis
  - AI-powered audit and reconciliation
  - QBO API patterns and accounting system integrations
  - Payroll compliance automation
  - Real-time financial dashboards and alerting
  - Franchise / multi-entity accounting patterns
  - AI for accounts payable and accounts receivable

# Added 2026-08-23: evaluations kept concluding "already built" (#1887 and the
# weeks before it) because project-level ideas don't survive contact with a
# mature repo. Demand technique-level deltas instead; empty is a valid output.
recommendation_guidance: |
  This project is MATURE. Field-level ideas ("adopt context engineering",
  "add an audit agent", "build an eval harness") are already built and will be
  closed as duplicates — do not propose them.
  - Propose at most 2 recommendations, and only NARROW implementation deltas:
    a specific technique, applied to a named module or workflow from the
    context above, that the article describes in enough technical detail to
    implement. If the article only names a concept without the how, it cannot
    support a recommendation.
  - Each recommendation must state what the repo does today in that spot and
    what would concretely change — a falsifiable delta, not a theme.
  - "No qualifying ideas this week" (empty project_recommendations) is a GOOD
    output and expected most weeks. Never pad toward a count.

