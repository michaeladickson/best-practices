  # area/* is REQUIRED (no area renders as "Unlabelled — needs an area" on
  # the Thursday agenda) and `sprint-next` was retired 2026-08-13.
  labels: ["area/app", "weekly-digest"]
  title_prefix: "Weekly digest"
